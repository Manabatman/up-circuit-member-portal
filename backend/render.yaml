services:
  - type: web
    name: upcircuit-portal-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.12"
      - key: LOGIN_OTP_REQUIRED
        value: "false"
      # Set in Render dashboard (secrets): DATABASE_URL, MIGRATOR_DATABASE_URL,
      # FRONTEND_ORIGIN, BREVO_API_KEY (when LOGIN_OTP_REQUIRED=true), EMAIL_FROM
